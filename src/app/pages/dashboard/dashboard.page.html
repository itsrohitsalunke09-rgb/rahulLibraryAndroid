<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Dashboard</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-refresher slot="fixed" (ionRefresh)="refresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <p class="greeting">Hello, <strong>{{ auth.user()?.fullName }}</strong></p>

  @if (error()) {
    <ion-text color="danger"><p>{{ error() }}</p></ion-text>
  }

  <div class="grid">
    @if (tiles(); as tiles) {
      @for (tile of tiles; track tile.label) {
        <button class="tile" [class]="'tone-' + tile.tone" (click)="open(tile)">
          <ion-icon [name]="tile.icon" aria-hidden="true"></ion-icon>
          <span class="value">{{ tile.value }}</span>
          <span class="label">{{ tile.label }}</span>
        </button>
      }
    } @else if (!error()) {
      @for (i of [1, 2, 3, 4, 5, 6]; track i) {
        <div class="tile"><ion-skeleton-text [animated]="true"></ion-skeleton-text></div>
      }
    }
  </div>
</ion-content>
