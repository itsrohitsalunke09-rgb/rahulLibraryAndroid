<!-- Same simple look as the sign-in screen: back arrow, heading, one line of help, fields, one button. -->
<ion-content [fullscreen]="true">
  <div class="screen">
    <button type="button" class="back" aria-label="Back to sign in" (click)="backToLogin()">
      <ion-icon name="arrow-back" aria-hidden="true"></ion-icon>
    </button>

    <form class="form" (ngSubmit)="submit()">
      <h1 class="title">Forgot password</h1>

      @if (step() === 'email') {
        <p class="hint">Enter the email on your account. We'll email you a 6-digit code.</p>

        <label class="input">
          <span class="sr-only">Email</span>
          <input
            name="email"
            type="email"
            inputmode="email"
            placeholder="Email"
            autocomplete="email"
            autocapitalize="off"
            [(ngModel)]="email" />
        </label>
      } @else {
        <p class="hint" aria-live="polite">
          If an account uses <strong>{{ email.trim() }}</strong>, we've emailed it a code. It works for 10 minutes.
        </p>

        <label class="input">
          <span class="sr-only">Code from the email</span>
          <input
            name="code"
            class="code"
            inputmode="numeric"
            maxlength="6"
            placeholder="6-digit code"
            autocomplete="one-time-code"
            [(ngModel)]="code" />
        </label>

        <label class="input">
          <span class="sr-only">New password</span>
          <input
            name="password"
            placeholder="New password (at least 6 characters)"
            autocomplete="new-password"
            [type]="showPassword() ? 'text' : 'password'"
            [(ngModel)]="password" />
          <button
            type="button"
            class="eye"
            [attr.aria-label]="showPassword() ? 'Hide passwords' : 'Show passwords'"
            [attr.aria-pressed]="showPassword()"
            (click)="showPassword.set(!showPassword())">
            @if (showPassword()) {
              <ion-icon name="eye-outline" aria-hidden="true"></ion-icon>
            } @else {
              <img src="assets/login/eye-off.svg" width="18" height="18" alt="" />
            }
          </button>
        </label>

        <label class="input">
          <span class="sr-only">Confirm new password</span>
          <input
            name="confirm"
            placeholder="Confirm new password"
            autocomplete="new-password"
            [type]="showPassword() ? 'text' : 'password'"
            [(ngModel)]="confirm" />
        </label>
      }

      @if (error()) {
        <p class="error" role="alert">{{ error() }}</p>
      }

      <button type="submit" class="primary" [disabled]="loading()">
        @if (loading()) {
          <ion-spinner name="crescent"></ion-spinner>
        } @else {
          {{ step() === 'email' ? 'Send code' : 'Change password' }}
        }
      </button>

      @if (step() === 'code') {
        <div class="row-links">
          <button type="button" class="link" (click)="changeEmail()">Change email</button>
          <button type="button" class="link" [disabled]="resendIn() > 0 || loading()" (click)="resend()">
            {{ resendIn() > 0 ? 'New code in ' + resendIn() + 's' : 'Send a new code' }}
          </button>
        </div>
      }
    </form>
  </div>
</ion-content>
