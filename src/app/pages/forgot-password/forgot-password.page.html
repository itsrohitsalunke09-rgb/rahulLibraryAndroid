<!-- Same look as the login screen (Figma "Airy aqua modernism"), with the form in place of the host photo. -->
<ion-content [fullscreen]="true">
  <div class="stage">
    <img class="backdrop" src="assets/login/sculptural-backdrop.svg" width="485" height="423" alt="" />
    <img class="accent" src="assets/login/floating-accent.svg" width="106" height="106" alt="" />

    <header class="masthead">
      <h1 class="marathi" lang="mr">राहुल वाचनालय</h1>
      <p class="place marathi" lang="mr">शिंदेवाडी</p>
    </header>

    <form id="reset-form" class="panel" (ngSubmit)="submit()">
      <h2 class="title">Forgot password</h2>

      @if (step() === 'email') {
        <p class="hint">Enter the email address on your account. We'll email you a 6-digit code.</p>

        <label class="field">
          <span class="field-label">Email</span>
          <span class="input">
            <input
              name="email"
              type="email"
              inputmode="email"
              placeholder="you@example.com"
              autocomplete="email"
              autocapitalize="off"
              [(ngModel)]="email" />
          </span>
        </label>
      } @else {
        <p class="hint" aria-live="polite">
          If an account uses <strong>{{ email.trim() }}</strong>, we've emailed it a code. It works for 10 minutes.
        </p>

        <label class="field">
          <span class="field-label">Code from the email</span>
          <span class="input">
            <input
              name="code"
              class="code"
              inputmode="numeric"
              maxlength="6"
              placeholder="6-digit code"
              autocomplete="one-time-code"
              [(ngModel)]="code" />
          </span>
        </label>

        <label class="field">
          <span class="field-label">New password</span>
          <span class="input">
            <input
              name="password"
              placeholder="At least 6 characters"
              autocomplete="new-password"
              [type]="showPassword() ? 'text' : 'password'"
              [(ngModel)]="password" />
            <button
              type="button"
              class="eye"
              [attr.aria-label]="showPassword() ? 'Hide passwords' : 'Show passwords'"
              [attr.aria-pressed]="showPassword()"
              (click)="showPassword.set(!showPassword())">
              @if (showPassword()) {
                <ion-icon name="eye-outline" aria-hidden="true"></ion-icon>
              } @else {
                <img src="assets/login/eye-off.svg" width="16" height="16" alt="" />
              }
            </button>
          </span>
        </label>

        <label class="field">
          <span class="field-label">Confirm new password</span>
          <span class="input">
            <input
              name="confirm"
              placeholder="Type it again"
              autocomplete="new-password"
              [type]="showPassword() ? 'text' : 'password'"
              [(ngModel)]="confirm" />
          </span>
        </label>

        <div class="row-links">
          <button type="button" class="forgot" (click)="changeEmail()">Change email</button>
          <button type="button" class="forgot" [disabled]="resendIn() > 0 || loading()" (click)="resend()">
            {{ resendIn() > 0 ? 'Send a new code in ' + resendIn() + 's' : 'Send a new code' }}
          </button>
        </div>
      }

      @if (error()) {
        <p class="error" role="alert">{{ error() }}</p>
      }
    </form>

    <div class="actions">
      <button type="submit" form="reset-form" class="login" [disabled]="loading()">
        @if (loading()) {
          <ion-spinner name="crescent"></ion-spinner>
        } @else {
          <span>{{ step() === 'email' ? 'Send code' : 'Change password' }}</span>
          <img src="assets/login/arrow-right.svg" width="22" height="22" alt="" />
        }
      </button>

      <footer class="links">
        <button type="button" class="about" (click)="backToLogin()">Back to sign in</button>
      </footer>
    </div>
  </div>
</ion-content>
