<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login"></ion-back-button>
    </ion-buttons>
    <ion-title>Create account</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form class="wrap" (ngSubmit)="submit()">
    <p class="lede">For students. The librarian can issue books to you once your account exists.</p>

    <h3 class="form-section">About you</h3>
    <div class="form-card">
      <label class="form-field">
        <span class="form-label">Full name</span>
        <span class="form-box">
          <span class="icon" style="--icon: url(assets/icons/field-user.svg)" aria-hidden="true"></span>
          <input name="fullName" autocomplete="name" [(ngModel)]="form.fullName" />
        </span>
      </label>
      <label class="form-field">
        <span class="form-label">Date of birth</span>
        <span class="form-box">
          <span class="icon" style="--icon: url(assets/icons/field-calendar.svg)" aria-hidden="true"></span>
          <input name="dateOfBirth" type="date" [max]="today" [(ngModel)]="form.dateOfBirth" />
        </span>
      </label>
      <label class="form-field">
        <span class="form-label">Address</span>
        <span class="form-box tall">
          <span class="icon" style="--icon: url(assets/icons/field-pin.svg)" aria-hidden="true"></span>
          <textarea name="address" rows="2" autocomplete="street-address" [(ngModel)]="form.address"></textarea>
        </span>
      </label>
    </div>

    <h3 class="form-section">Contact</h3>
    <div class="form-card">
      <label class="form-field">
        <span class="form-label">Mobile number</span>
        <span class="form-box">
          <span class="icon" style="--icon: url(assets/icons/field-phone.svg)" aria-hidden="true"></span>
          <input name="phone" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel-national"
                 [(ngModel)]="form.phone" />
        </span>
        <span class="form-helper">10 digits, used for due-date reminders</span>
      </label>
      <label class="form-field">
        <span class="form-label">Email</span>
        <span class="form-box">
          <span class="icon" style="--icon: url(assets/icons/field-mail.svg)" aria-hidden="true"></span>
          <input name="email" type="email" autocomplete="email" [(ngModel)]="form.email" />
        </span>
      </label>
    </div>

    <h3 class="form-section">Sign-in details</h3>
    <div class="form-card">
      <label class="form-field">
        <span class="form-label">Username</span>
        <span class="form-box">
          <span class="icon" style="--icon: url(assets/icons/field-at.svg)" aria-hidden="true"></span>
          <input name="username" autocapitalize="off" autocomplete="username" [(ngModel)]="form.username" />
        </span>
      </label>
      <label class="form-field">
        <span class="form-label">Password</span>
        <span class="form-box">
          <span class="icon" style="--icon: url(assets/icons/field-lock.svg)" aria-hidden="true"></span>
          <input name="password" [type]="showPassword() ? 'text' : 'password'" autocomplete="new-password"
                 [(ngModel)]="form.password" />
          <button type="button" class="form-box-action" [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
                  (click)="showPassword.set(!showPassword())">
            <ion-icon [name]="showPassword() ? 'eye-off-outline' : 'eye-outline'" aria-hidden="true"></ion-icon>
          </button>
        </span>
        <span class="form-helper">At least 6 characters</span>
      </label>
    </div>

    @if (error()) {
      <p class="form-error" role="alert">{{ error() }}</p>
    }

    <ion-button type="submit" expand="block" [disabled]="loading()">
      @if (loading()) {
        <ion-spinner name="crescent"></ion-spinner>
      } @else {
        Create account
      }
    </ion-button>
  </form>
</ion-content>
