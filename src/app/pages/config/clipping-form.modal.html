<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button class="close-x" aria-label="Close" (click)="cancel()">
        <span class="icon" style="--icon: url(assets/icons/close.svg); --icon-size: 18px" aria-hidden="true"></span>
      </ion-button>
    </ion-buttons>
    <ion-title>{{ clipping ? 'Edit कात्रण' : 'Add कात्रण' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form class="form" (ngSubmit)="save()">
    @if (error()) {
      <p class="form-error" role="alert">{{ error() }}</p>
    }

    <h3 class="form-section marathi">कात्रण</h3>
    <div class="form-card">
      <label class="form-field">
        <span class="form-label">Title *</span>
        <span class="form-box">
          <span class="icon" style="--icon: url(assets/icons/copies.svg)" aria-hidden="true"></span>
          <input class="marathi" name="title" maxlength="200" placeholder="e.g. स्वातंत्र्य लढा" [(ngModel)]="form.title" />
        </span>
      </label>
      <div class="years">
        <label class="form-field">
          <span class="form-label">From year *</span>
          <span class="form-box select">
            <select name="yearFrom" [(ngModel)]="form.yearFrom" (ngModelChange)="fromChanged()">
              <option value="">Choose</option>
              @for (y of years; track y) {
                <option [ngValue]="y">{{ y }}</option>
              }
            </select>
            <span class="icon chevron" style="--icon: url(assets/icons/chevron-down.svg)" aria-hidden="true"></span>
          </span>
        </label>
        <label class="form-field">
          <span class="form-label">To year</span>
          <span class="form-box select">
            <select name="yearTo" [(ngModel)]="form.yearTo">
              <option value="">Same year</option>
              @for (y of toYears(); track y) {
                <option [ngValue]="y">{{ y }}</option>
              }
            </select>
            <span class="icon chevron" style="--icon: url(assets/icons/chevron-down.svg)" aria-hidden="true"></span>
          </span>
        </label>
      </div>
      <span class="form-helper">"To year" lists only years from the "From" year on. Keep "Same year" for clippings from one year.</span>
    </div>

    <button type="submit" class="save" [disabled]="saving() || deleting()">
      @if (saving()) { <ion-spinner name="crescent"></ion-spinner> } @else { Save }
    </button>

    @if (clipping) {
      <button type="button" class="delete" [disabled]="saving() || deleting()" (click)="remove()">
        @if (deleting()) { <ion-spinner name="crescent"></ion-spinner> } @else {
          <span class="icon" style="--icon: url(assets/icons/trash.svg)" aria-hidden="true"></span>
          Delete
        }
      </button>
    }
  </form>
</ion-content>
