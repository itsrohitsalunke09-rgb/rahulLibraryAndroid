<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button class="close-x" aria-label="Close" (click)="cancel()">
        <span class="icon" style="--icon: url(assets/icons/close.svg); --icon-size: 18px" aria-hidden="true"></span>
      </ion-button>
    </ion-buttons>
    <ion-title>Mark received</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="wrap">
    <section class="magazine">
      <span class="name marathi">{{ card.name }}</span>
      <span class="meta">{{ monthly ? 'Monthly' : card.frequency === 'WEEKLY' ? 'Weekly' : 'Fortnightly' }}{{ card.language ? ' · ' + card.language : '' }}</span>
    </section>

    <label class="field">
      <span class="label marathi">अंक (issue number)</span>
      <span class="box issue">
        <span class="prefix marathi" aria-hidden="true">अंक</span>
        <input type="number" inputmode="numeric" min="1" step="1" name="issueNo" [(ngModel)]="issueNo" />
      </span>
    </label>

    @if (monthly) {
      <label class="field">
        <span class="label">Published on</span>
        <span class="box">
          <span class="icon" style="--icon: url(assets/icons/field-calendar.svg); --icon-size: 18px" aria-hidden="true"></span>
          <input type="date" name="publishedOn" [max]="today" [(ngModel)]="publishedOn" />
        </span>
      </label>
    } @else {
      <div class="range">
        <label class="field">
          <span class="label">From</span>
          <span class="box"><input type="date" name="periodFrom" [max]="today" [(ngModel)]="periodFrom" /></span>
        </label>
        <label class="field">
          <span class="label">To</span>
          <span class="box"><input type="date" name="periodTo" [min]="periodFrom" [(ngModel)]="periodTo" /></span>
        </label>
      </div>
    }
  </div>
</ion-content>

<ion-footer>
  <div class="bar">
    @if (error()) {
      <p class="form-error" role="alert">{{ error() }}</p>
    }
    <button type="button" class="primary" [disabled]="saving()" (click)="save()">
      @if (saving()) { <ion-spinner name="crescent"></ion-spinner> } @else { Save }
    </button>
  </div>
</ion-footer>
