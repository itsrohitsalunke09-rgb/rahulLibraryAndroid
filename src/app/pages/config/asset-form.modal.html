<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button class="close-x" aria-label="Close" (click)="cancel()">
        <span class="icon" style="--icon: url(assets/icons/close.svg); --icon-size: 18px" aria-hidden="true"></span>
      </ion-button>
    </ion-buttons>
    <ion-title>{{ asset ? 'Edit asset' : 'Add asset' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form class="form" (ngSubmit)="save()">
    @if (error()) {
      <p class="form-error" role="alert">{{ error() }}</p>
    }

    <h3 class="form-section">Asset</h3>
    <div class="form-card">
      <label class="form-field">
        <span class="form-label">Name *</span>
        <span class="form-box">
          <span class="icon" style="--icon: url(assets/icons/tag.svg)" aria-hidden="true"></span>
          <input name="name" maxlength="150" placeholder="e.g. Steel almirah" [(ngModel)]="form.name" />
        </span>
      </label>
      <div class="pair">
        <label class="form-field">
          <span class="form-label">Quantity</span>
          <span class="form-box">
            <span class="icon" style="--icon: url(assets/icons/copies.svg)" aria-hidden="true"></span>
            <input name="quantity" type="number" min="1" step="1" inputmode="numeric" [(ngModel)]="form.quantity" />
          </span>
        </label>
        <label class="form-field">
          <span class="form-label">Condition</span>
          <span class="form-box select">
            <select name="condition" [(ngModel)]="form.condition">
              @for (c of conditions; track c[0]) {
                <option [value]="c[0]">{{ c[1] }}</option>
              }
            </select>
            <span class="icon chevron" style="--icon: url(assets/icons/chevron-down.svg)" aria-hidden="true"></span>
          </span>
        </label>
      </div>
      <label class="form-field">
        <span class="form-label">Place</span>
        <span class="form-box">
          <span class="icon" style="--icon: url(assets/icons/field-pin.svg)" aria-hidden="true"></span>
          <input name="location" maxlength="150" placeholder="e.g. Reading hall" [(ngModel)]="form.location" />
        </span>
      </label>
    </div>

    <h3 class="form-section">Purchase</h3>
    <div class="form-card">
      <label class="form-field">
        <span class="form-label">Bought on</span>
        <span class="form-box">
          <span class="icon" style="--icon: url(assets/icons/field-calendar.svg)" aria-hidden="true"></span>
          <input name="purchaseDate" type="date" [max]="today" [(ngModel)]="form.purchaseDate" />
        </span>
      </label>
      <label class="form-field">
        <span class="form-label">Price (₹)</span>
        <span class="form-box">
          <input name="price" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Total for all of them" [(ngModel)]="form.price" />
        </span>
      </label>
      <label class="form-field">
        <span class="form-label">Notes</span>
        <span class="form-box tall">
          <span class="icon" style="--icon: url(assets/icons/sheet.svg)" aria-hidden="true"></span>
          <textarea name="notes" rows="3" maxlength="500" placeholder="e.g. Donated by …, serial number, repairs" [(ngModel)]="form.notes"></textarea>
        </span>
      </label>
    </div>

    <button type="submit" class="save" [disabled]="saving() || deleting()">
      @if (saving()) { <ion-spinner name="crescent"></ion-spinner> } @else { Save }
    </button>

    @if (asset) {
      <button type="button" class="delete" [disabled]="saving() || deleting()" (click)="remove()">
        @if (deleting()) { <ion-spinner name="crescent"></ion-spinner> } @else {
          <span class="icon" style="--icon: url(assets/icons/trash.svg)" aria-hidden="true"></span>
          Delete
        }
      </button>
    }
  </form>
</ion-content>
