<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/profile" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Masters</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <!-- The Registers screen's soft cards; pulled past either end, they stretch and spring back. -->
  <div class="wrap" appStretch>
    <p class="intro">Lists the rest of the app picks from. Changes apply everywhere straight away.</p>
    @for (c of cards(); track c.link) {
      <a class="report" [class]="c.tone" [routerLink]="c.link">
        <span class="icon kind" [style.--icon]="'url(assets/icons/' + c.icon + '.svg)'" aria-hidden="true"></span>
        <span class="text">
          <span class="title" [class.marathi]="c.marathi" [attr.lang]="c.marathi ? 'mr' : null">{{ c.title }}</span>
          <span class="sub">{{ c.sub }}</span>
        </span>
        @if (c.count !== null) {
          <span class="count" [attr.aria-label]="c.count + ' items'">{{ c.count }}</span>
        }
        <span class="icon chevron" style="--icon: url(assets/icons/chevron.svg)" aria-hidden="true"></span>
      </a>
    }
  </div>
</ion-content>
