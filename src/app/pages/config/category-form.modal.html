<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button class="close-x" aria-label="Close" (click)="cancel()">
        <span class="icon" style="--icon: url(assets/icons/close.svg); --icon-size: 18px" aria-hidden="true"></span>
      </ion-button>
    </ion-buttons>
    <ion-title>{{ category ? 'Edit category' : 'Add category' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button strong (click)="save()" [disabled]="saving() || deleting()">
        @if (saving()) { <ion-spinner name="crescent"></ion-spinner> } @else { Save }
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form class="form" (ngSubmit)="save()">
    @if (error()) {
      <p class="form-error" role="alert">{{ error() }}</p>
    }

    <h3 class="form-section">Book category</h3>
    <div class="form-card">
      <label class="form-field">
        <span class="form-label">Category number *</span>
        <span class="form-box">
          <span class="icon" style="--icon: url(assets/icons/field-at.svg)" aria-hidden="true"></span>
          <input name="categoryNumber" maxlength="20" [(ngModel)]="form.categoryNumber" />
        </span>
      </label>
      <label class="form-field">
        <span class="form-label">Category name *</span>
        <span class="form-box">
          <span class="icon" style="--icon: url(assets/icons/tag.svg)" aria-hidden="true"></span>
          <input class="marathi" name="name" maxlength="100" [(ngModel)]="form.name" />
        </span>
        <span class="form-helper">
          Numbers and names must be unique. Renaming a category also renames it on every book that uses it.
        </span>
      </label>
    </div>

    @if (category) {
      <button type="button" class="delete" [disabled]="saving() || deleting()" (click)="remove()">
        @if (deleting()) { <ion-spinner name="crescent"></ion-spinner> } @else {
          <span class="icon" style="--icon: url(assets/icons/trash.svg)" aria-hidden="true"></span>
          Delete category
        }
      </button>
    }
  </form>
</ion-content>
