<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="refresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <!-- The header is fixed text, so it shows at once; only the stories wait for the server. -->
  <header class="header">
    <h1 class="name">Programs &amp; events</h1>
  </header>

  <div class="list">
    @if (stories.error()) {
      <p class="page-error" role="alert">{{ stories.error() }}</p>
    }

    @if (stories.loaded()) {
      @if (stories.items().length) {
        <div class="cards">
          @for (s of stories.items(); track s.id) {
            <button type="button" class="card-button" [attr.aria-label]="s.headline" (click)="open(s)">
              <app-news-card [story]="s" />
            </button>
          }
        </div>
      } @else if (!stories.error()) {
        <p class="empty">No news yet — the librarian's stories will appear here.</p>
      }
    } @else if (!stories.error()) {
      <app-page-skeleton kind="cards" />
    }
  </div>

  <ion-infinite-scroll [disabled]="stories.finished()" (ionInfinite)="stories.more($event)">
    <ion-infinite-scroll-content></ion-infinite-scroll-content>
  </ion-infinite-scroll>
</ion-content>
