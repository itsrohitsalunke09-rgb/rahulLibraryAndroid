<ion-content class="ion-padding">
  <div class="wrap">
    <div class="brand">
      <img src="assets/logo.svg" alt="" />
      <h1 class="marathi">राहुल सार्वजनिक वाचनालय</h1>
      <p>Rahul Library · Sign in to continue</p>
    </div>

    <form (ngSubmit)="submit()">
      <ion-list lines="none">
        <ion-input
          label="Username"
          labelPlacement="floating"
          fill="outline"
          name="username"
          autocomplete="username"
          autocapitalize="off"
          [(ngModel)]="username">
        </ion-input>

        <ion-input
          label="Password"
          labelPlacement="floating"
          fill="outline"
          type="password"
          name="password"
          autocomplete="current-password"
          [(ngModel)]="password">
          <ion-input-password-toggle slot="end"></ion-input-password-toggle>
        </ion-input>
      </ion-list>

      @if (error()) {
        <ion-text color="danger"><p class="error">{{ error() }}</p></ion-text>
      }

      <ion-button type="submit" expand="block" [disabled]="loading()">
        @if (loading()) {
          <ion-spinner name="crescent"></ion-spinner>
        } @else {
          Sign in
        }
      </ion-button>
    </form>

    <p class="switch">
      New student? <a routerLink="/register">Create an account</a>
    </p>
  </div>
</ion-content>
