<!-- Simple dark/light sign-in: one column, one blue accent for actions, outlined fields. -->
<ion-content [fullscreen]="true">
  <div class="screen">
    <main class="body">
      <img class="logo" src="assets/logo.svg" width="521" height="327" alt="" />
      <h1 class="name marathi" lang="mr">राहुल वाचनालय</h1>
      <p class="place marathi" lang="mr">शिंदेवाडी</p>

      <form class="form" (ngSubmit)="submit()">
        <label class="input">
          <span class="sr-only">Username</span>
          <input
            name="username"
            placeholder="Username"
            autocomplete="username"
            autocapitalize="off"
            [(ngModel)]="username" />
          <span class="icon" style="--icon: url(assets/icons/field-user.svg); --icon-size: 18px" aria-hidden="true"></span>
        </label>

        <label class="input">
          <span class="sr-only">Password</span>
          <input
            name="password"
            placeholder="Password"
            autocomplete="current-password"
            [type]="showPassword() ? 'text' : 'password'"
            [(ngModel)]="password" />
          <button
            type="button"
            class="eye"
            [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
            [attr.aria-pressed]="showPassword()"
            (click)="showPassword.set(!showPassword())">
            @if (showPassword()) {
              <ion-icon name="eye-outline" aria-hidden="true"></ion-icon>
            } @else {
              <img src="assets/login/eye-off.svg" width="18" height="18" alt="" />
            }
          </button>
        </label>

        @if (error()) {
          <p class="error" role="alert">{{ error() }}</p>
        } @else if (notice()) {
          <p class="notice" role="status">{{ notice() }}</p>
        }

        <button type="submit" class="primary" [disabled]="loading()">
          @if (loading()) { <ion-spinner name="crescent"></ion-spinner> } @else { Log in }
        </button>
        <button type="button" class="link" (click)="forgotPassword()">Forgot password?</button>
      </form>
    </main>

    <footer class="foot">
      <button type="button" class="outline" (click)="aboutUs()">About us</button>
      <p class="brand marathi" lang="mr">राहुल सार्वजनिक वाचनालय</p>
    </footer>
  </div>
</ion-content>
