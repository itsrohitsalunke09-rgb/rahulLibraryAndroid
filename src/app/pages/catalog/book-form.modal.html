<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-button (click)="cancel()">Cancel</ion-button>
    </ion-buttons>
    <ion-title>{{ book ? 'Edit book' : 'Add book' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button strong (click)="save()" [disabled]="saving()">
        @if (saving()) { <ion-spinner name="crescent"></ion-spinner> } @else { Save }
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  @if (error()) {
    <ion-text color="danger"><p>{{ error() }}</p></ion-text>
  }

  <ion-list lines="none">
    <ion-input label="Title *" labelPlacement="floating" fill="outline" [(ngModel)]="form.title"></ion-input>
    <ion-input label="Author *" labelPlacement="floating" fill="outline" [(ngModel)]="form.author"></ion-input>
    <ion-input label="Category" labelPlacement="floating" fill="outline" [(ngModel)]="form.category"></ion-input>
    <ion-input label="Total copies *" labelPlacement="floating" fill="outline" type="number" min="1"
               inputmode="numeric" [(ngModel)]="form.totalCopies"></ion-input>
    <ion-textarea label="Description" labelPlacement="floating" fill="outline" rows="3" [autoGrow]="true"
                  [(ngModel)]="form.description"></ion-textarea>

    <ion-list-header>Catalogue details</ion-list-header>
    <ion-input label="Registration number" labelPlacement="floating" fill="outline" [(ngModel)]="form.registrationNumber"></ion-input>
    <ion-input label="Publication" labelPlacement="floating" fill="outline" [(ngModel)]="form.publication"></ion-input>
    <ion-input label="Publication year" labelPlacement="floating" fill="outline" type="number" inputmode="numeric"
               [(ngModel)]="form.publicationYear"></ion-input>
    <ion-input label="Page count" labelPlacement="floating" fill="outline" type="number" inputmode="numeric"
               [(ngModel)]="form.pageCount"></ion-input>

    <ion-list-header>Purchase</ion-list-header>
    <ion-input label="Date added" labelPlacement="stacked" fill="outline" type="date" [(ngModel)]="form.date"></ion-input>
    <ion-input label="Seller" labelPlacement="floating" fill="outline" [(ngModel)]="form.seller"></ion-input>
    <ion-input label="Receipt number" labelPlacement="floating" fill="outline" [(ngModel)]="form.receiptNumber"></ion-input>
    <ion-input label="Price (₹)" labelPlacement="floating" fill="outline" type="number" step="0.01" inputmode="decimal"
               [(ngModel)]="form.price"></ion-input>
  </ion-list>
</ion-content>
