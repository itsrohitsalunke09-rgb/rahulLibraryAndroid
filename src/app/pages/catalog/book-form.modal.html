<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button class="close-x" aria-label="Close" (click)="cancel()">
        <span class="icon" style="--icon: url(assets/icons/close.svg); --icon-size: 18px" aria-hidden="true"></span>
      </ion-button>
    </ion-buttons>
    <ion-title>{{ book ? 'Edit book' : 'Add book' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button strong (click)="save()" [disabled]="saving()">
        @if (saving()) { <ion-spinner name="crescent"></ion-spinner> } @else { Save }
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form class="form" (ngSubmit)="save()">
    @if (error()) {
      <p class="form-error" role="alert">{{ error() }}</p>
    }

    <h3 class="form-section">Book</h3>
    <div class="form-card">
      <label class="form-field">
        <span class="form-label">Title *</span>
        <span class="form-box">
          <span class="icon" style="--icon: url(assets/icons/book.svg)" aria-hidden="true"></span>
          <input name="title" [(ngModel)]="form.title" />
        </span>
      </label>
      <label class="form-field">
        <span class="form-label">Author *</span>
        <span class="form-box">
          <span class="icon" style="--icon: url(assets/icons/field-user.svg)" aria-hidden="true"></span>
          <input name="author" [(ngModel)]="form.author" />
        </span>
      </label>
      <label class="form-field">
        <span class="form-label">Category</span>
        <span class="form-box select">
          <span class="icon" style="--icon: url(assets/icons/tag.svg)" aria-hidden="true"></span>
          <select class="marathi" name="categoryChoice" [(ngModel)]="form.categoryChoice">
            <option value="">No category</option>
            @for (c of categories.items(); track c.id) {
              <option [value]="'' + c.id">{{ c.categoryNumber }} · {{ c.name }}</option>
            }
            @if (oldCategory) {
              <option [value]="keepText">{{ oldCategory }} (not in master)</option>
            }
          </select>
          <span class="icon chevron" style="--icon: url(assets/icons/chevron-down.svg)" aria-hidden="true"></span>
        </span>
        @if (categories.loaded() && !categories.items().length) {
          <span class="form-helper">No categories yet. Add them in Config → Book categories.</span>
        }
      </label>
    </div>

    <h3 class="form-section">Catalogue details</h3>
    <div class="form-card">
      <label class="form-field">
        <span class="form-label">Registration number</span>
        <span class="form-box">
          <span class="icon" style="--icon: url(assets/icons/field-at.svg)" aria-hidden="true"></span>
          <input name="registrationNumber" [(ngModel)]="form.registrationNumber" />
        </span>
      </label>
      <label class="form-field">
        <span class="form-label">Publication</span>
        <span class="form-box">
          <span class="icon" style="--icon: url(assets/icons/field-pin.svg)" aria-hidden="true"></span>
          <input class="marathi" name="publication" [(ngModel)]="form.publication" />
        </span>
      </label>
      <div class="form-pair">
        <label class="form-field">
          <span class="form-label">Publication year</span>
          <span class="form-box select">
            <span class="icon" style="--icon: url(assets/icons/field-calendar.svg)" aria-hidden="true"></span>
            <select name="publicationYear" [(ngModel)]="form.publicationYear">
              <option value="">Not known</option>
              @for (y of years; track y) {
                <option [ngValue]="y">{{ y }}</option>
              }
            </select>
            <span class="icon chevron" style="--icon: url(assets/icons/chevron-down.svg)" aria-hidden="true"></span>
          </span>
        </label>
        <label class="form-field">
          <span class="form-label">Page count</span>
          <span class="form-box">
            <span class="icon" style="--icon: url(assets/icons/sheet.svg)" aria-hidden="true"></span>
            <input name="pageCount" type="number" inputmode="numeric" [(ngModel)]="form.pageCount" />
          </span>
        </label>
      </div>
    </div>

    <h3 class="form-section">Purchase</h3>
    <div class="form-card">
      <label class="form-field">
        <span class="form-label">Date added</span>
        <span class="form-box">
          <span class="icon" style="--icon: url(assets/icons/field-calendar.svg)" aria-hidden="true"></span>
          <input name="date" type="date" [(ngModel)]="form.date" />
        </span>
      </label>
      <label class="form-field">
        <span class="form-label">Seller</span>
        <span class="form-box">
          <span class="icon" style="--icon: url(assets/icons/user.svg)" aria-hidden="true"></span>
          <input class="marathi" name="seller" [(ngModel)]="form.seller" />
        </span>
      </label>
      <div class="form-pair">
        <label class="form-field">
          <span class="form-label">Receipt number</span>
          <span class="form-box">
            <span class="icon" style="--icon: url(assets/icons/sheet.svg)" aria-hidden="true"></span>
            <input name="receiptNumber" [(ngModel)]="form.receiptNumber" />
          </span>
        </label>
        <label class="form-field">
          <span class="form-label">Price (₹)</span>
          <span class="form-box">
            <span class="icon" style="--icon: url(assets/icons/tag.svg)" aria-hidden="true"></span>
            <input name="price" type="number" step="0.01" inputmode="decimal" [(ngModel)]="form.price" />
          </span>
        </label>
      </div>
    </div>
  </form>
</ion-content>
